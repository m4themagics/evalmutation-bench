[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "evalmutationbench"
version = "0.1.0"
description = "Mutation-testing benchmark for LLM evaluation and release-gate systems"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "EvalMutationBench contributors" }]
dependencies = [
  "duckdb>=1.4,<2",
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
llm = ["litellm>=1.75,<2"]
parquet = ["pyarrow>=18,<24"]
reference = [
  "langgraph>=1.0,<2",
  "sentence-transformers>=5,<6",
]
dev = [
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
evalmut = "evalmutationbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evalmutationbench"]

[tool.hatch.build]
exclude = [
  "/.coverage",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.uv-cache",
  "/.venv",
  "/artifacts/smoke",
  "/dist",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evalmutationbench"]

